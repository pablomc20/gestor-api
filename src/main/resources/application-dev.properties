# Configuración para Ambiente de Desarrollo
server.port=${SERVER_PORT_BACK:8082}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ----------------------------------------
# DATABASE CONNECTION (Drivers and Base Hikari)
# ----------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# ----------------------------------------
# MINIO (Dev defaults)
# ----------------------------------------
minio.url=${MINIO_ENDPOINT:http://192.168.100.100:9000}
minio.access.key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret.key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.name=${MINIO_BUCKET_NAME:name-bucket}

# ----------------------------------------
# LOGGING
# ----------------------------------------
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n